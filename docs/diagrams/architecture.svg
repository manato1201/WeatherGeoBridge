<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" role="img" aria-labelledby="t d"><title id="t">WeatherGeoBridge の構成</title><desc id="d">ブラウザは Next.js のサーバー側(API キーを持つ)を通して、Cloudflare Worker を呼ぶ。Worker は Open-Meteo から取得・正規化し、KV にキャッシュし、定期ジョブで差分を調べて Web Push を送る。MCP サーバー(Python)は、同じ Worker の公開 API を呼び、傘・洗濯の判断を返す。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1500" height="760" fill="var(--bg)"/><rect width="1500" height="760" fill="url(#g)"/><rect x="40" y="100" width="250" height="560" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="62" y="90" width="69.39999999999999" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--gray)">CLIENTS</text><rect x="480" y="100" width="560" height="560" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="502" y="90" width="69.39999999999999" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="104.5" style="fill:var(--teal)">SERVERS</text><rect x="1100" y="100" width="370" height="560" rx="14" fill="var(--f-blue)" stroke="var(--blue)" stroke-width="1.5"/><rect x="1122" y="90" width="135.0" height="20" fill="var(--bg)"/><text class="glabel mono" x="1128" y="104.5" style="fill:var(--blue)">DATA — 外部とストレージ</text><path class="a primary" d="M182.0 220.0 L608.0 220.0"/><path class="h primary" d="M608.0 220.0 L597.0 214.5 L597.0 225.5 Z"/><path class="a primary" d="M672.0 220.0 L780.0 220.0 L780.0 340.0 L868.0 340.0"/><path class="h primary" d="M868.0 340.0 L857.0 334.5 L857.0 345.5 Z"/><path class="a primary" d="M182.0 460.0 L608.0 460.0"/><path class="h primary" d="M608.0 460.0 L597.0 454.5 L597.0 465.5 Z"/><path class="a primary" d="M672.0 460.0 L780.0 460.0 L780.0 340.0"/><path class="h primary" d="M780.0 340.0 L774.5 351.0 L785.5 351.0 Z"/><path class="a primary" d="M932.0 340.0 L1000.0 340.0 L1000.0 220.0 L1253.0 220.0"/><path class="h primary" d="M1253.0 220.0 L1242.0 214.5 L1242.0 225.5 Z"/><path class="a primary" d="M1000.0 340.0 L1000.0 400.0 L1253.0 400.0"/><path class="h primary" d="M1253.0 400.0 L1242.0 394.5 L1242.0 405.5 Z"/><path class="a secondary" d="M1000.0 400.0 L1000.0 560.0 L1253.0 560.0"/><path class="h secondary" d="M1253.0 560.0 L1242.0 554.5 L1242.0 565.5 Z"/><rect class="card" x="118.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 200.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><rect class="card" x="118.0" y="428.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 440.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="608.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 200.0) scale(1.000)"><rect x="5" y="6" width="30" height="12" rx="3"/><rect x="5" y="22" width="30" height="12" rx="3"/><circle class="fill" cx="11" cy="12" r="1.5"/><circle class="fill" cx="11" cy="28" r="1.5"/></g><rect class="card" x="608.0" y="428.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 440.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="868.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 320.0) scale(1.000)"><path d="M11 31a7 7 0 0 1 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><rect class="card" x="1253.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1265.0 200.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M5 20h30M20 5c-6 5-6 25 0 30M20 5c6 5 6 25 0 30"/></g><rect class="card" x="1253.0" y="368.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1265.0 380.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="1253.0" y="528.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1265.0 540.0) scale(1.000)"><path d="M11 31a7 7 0 0 1 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><text class="title" x="150" y="272.0">ブラウザ</text><text class="sub mono" x="150" y="291.0">ダッシュボード・アトラス</text><text class="sub mono" x="150" y="306.0">(地図 + 時間スライダー)</text><text class="title" x="150" y="512.0">AI(MCP クライアント)</text><text class="sub mono" x="150" y="531.0">get_weather・get_forecast</text><text class="sub mono" x="150" y="546.0">decide_umbrella・decide_laundry</text><text class="title" x="640" y="272.0">Next.js(Vercel)</text><text class="sub mono" x="640" y="291.0">API ルート(サーバー側)</text><text class="sub mono" x="640" y="306.0">X-API-Key を付けて中継</text><text class="title" x="640" y="512.0">mcp_server/</text><text class="sub mono" x="640" y="531.0">Python・stateless</text><text class="sub mono" x="640" y="546.0">ルールベースの判断</text><text class="title" x="900" y="392.0">Cloudflare Worker</text><text class="sub mono" x="900" y="411.0">Hono + TypeScript</text><text class="sub mono" x="900" y="426.0">正規化・キャッシュ・通知</text><text class="title" x="1285" y="272.0">Open-Meteo</text><text class="sub mono" x="1285" y="291.0">天気・予報・大気質</text><text class="title" x="1285" y="452.0">Workers KV</text><text class="sub mono" x="1285" y="471.0">WEATHER_CACHE</text><text class="sub mono" x="1285" y="486.0">PUSH_SUBSCRIPTIONS</text><text class="title" x="1285" y="612.0">Web Push</text><text class="sub mono" x="1285" y="631.0">VAPID・購読者ごとの地点</text><rect class="lab" x="373.9" y="201.0" width="42.3" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="213.0">HTTPS</text><rect class="lab" x="769.9" y="319.0" width="68.1" height="16" rx="3"/><text class="alabel mono blue" x="804.0" y="331.0">X-API-Key</text><rect class="lab" x="380.3" y="441.0" width="29.4" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="453.0">MCP</text><rect class="lab" x="667.1" y="439.0" width="117.8" height="16" rx="3"/><text class="alabel mono blue" x="726.0" y="451.0">Worker の公開 API</text><rect class="lab" x="1109.3" y="199.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="1126.5" y="211.0">取得</text><rect class="lab" x="1060.9" y="379.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="1096.5" y="391.0">キャッシュ</text><rect class="lab" x="1039.8" y="549.0" width="83.4" height="16" rx="3"/><text class="alabel mono " x="1081.5" y="561.0">差分があれば</text><text class="hd" x="40" y="44" text-anchor="start">WeatherGeoBridge — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。キーはサーバー側だけ。判断はルールベースの純粋関数</text><text class="note" x="500" y="640" text-anchor="start">キャッシュ: 使える 10 分(fetchedAt で判定)と、KV の保存 7 日を分ける</text></svg>
